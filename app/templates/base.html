{% from 'partials/icons.html' import icon %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find free Udemy courses, check the latest coupons, and save your next learning opportunity.">
  <meta name="color-scheme" content="light dark">
  <script src="/static/js/theme.js"></script>
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="/static/css/header.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="/static/js/main.js" defer></script>
  <script src="/static/js/header.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-shell">
      <a class="wordmark" href="/" aria-label="Coursemy, home">Coursemy<span>Free courses</span></a>
      <nav class="header-desktop-nav" aria-label="Main navigation">
        <a class="nav-link {% if request.url.path == '/' %}is-active{% endif %}" href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}><span>Home</span></a>
        <a class="nav-link {% if request.url.path == '/courses' %}is-active{% endif %}" href="/courses" {% if request.url.path == '/courses' %}aria-current="page"{% endif %}><span>Courses</span></a>
      </nav>
      <div class="theme-control" role="group" aria-label="Appearance">
        <button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="false" title="Light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
        <button type="button" data-theme-choice="dark" aria-label="Dark theme" aria-pressed="false" title="Dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg></button>
        <button type="button" data-theme-choice="system" aria-label="Use system theme" aria-pressed="true" title="System"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button>
      </div>
      <details class="header-mobile-menu">
        <summary aria-label="Navigation menu"><svg class="menu-open-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><svg class="menu-close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></summary>
        <nav class="header-mobile-panel" aria-label="Mobile navigation">
          <a class="nav-link {% if request.url.path == '/' %}is-active{% endif %}" href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Home</a>
          <a class="nav-link {% if request.url.path == '/courses' %}is-active{% endif %}" href="/courses" {% if request.url.path == '/courses' %}aria-current="page"{% endif %}>Courses</a>
        </nav>
      </details>
    </div>
  </header>
  <main id="main" class="shell">{% block content %}{% endblock %}</main>
  <footer class="shell site-footer flex flex-wrap items-center justify-between gap-4">
    <p>{{ app_name }}</p>
    <p class="muted">Final pricing and availability are determined by Udemy.</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
