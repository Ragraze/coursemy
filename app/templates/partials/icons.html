{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'book' %}<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 3H20v19H6.5A2.5 2.5 0 0 1 4 19.5v-14A2.5 2.5 0 0 1 6.5 3Z"/><path d="M8 7h8M8 11h5"/>
{% elif name == 'bookmark' %}<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
{% elif name == 'search' %}<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
{% elif name == 'refresh' %}<path d="M3 11a9 9 0 0 1 15.4-6.4L21 7M21 3v4h-4M21 13a9 9 0 0 1-15.4 6.4L3 17M3 21v-4h4"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
{% elif name == 'star' %}<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a17 17 0 0 1 0 20 17 17 0 0 1 0-20"/>
{% elif name == 'arrow' %}<path d="M7 17 17 7M7 7h10v10"/>
{% elif name == 'back' %}<path d="m12 19-7-7 7-7M5 12h14"/>
{% elif name == 'code' %}<path d="m16 18 6-6-6-6M8 6l-6 6 6 6m6-15-4 18"/>
{% elif name == 'check' %}<path d="m20 6-11 11-5-5"/>
{% elif name == 'copy' %}<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
{% elif name == 'chevron' %}<path d="m9 18 6-6-6-6"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
{% endif %}
</svg>
{%- endmacro %}
