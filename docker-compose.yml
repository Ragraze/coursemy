services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coursemy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coursemy}
      UPSTREAM_API_BASE: ${UPSTREAM_API_BASE:?Set UPSTREAM_API_BASE in .env}
      APP_NAME: ${APP_NAME:-Coursemy}
      BLOB_DIR: /app/app/static/blobs
      SCHEDULER_ENABLED: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - covers:/app/app/static/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coursemy}
      POSTGRES_USER: ${POSTGRES_USER:-coursemy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  covers:
